[project]
name = "bocarsly-magnets"
version = "0.1.0"
description = "A website for visualizing data from: J.D. Bocarsly, E.E. Levin, C.A.C. Garcia, K. Schwennicke, S.D. Wilson, R. Seshadri, A Simple Computational Proxy for Screening Magnetocaloric Compounds, Chem. Mater. 29 (2017) 1613−1622 https://doi.org/10.1021/acs.chemmater.6b04729"
readme = "README.md"
requires-python = "~=3.10.0"
dependencies = [
    "bokeh==2.4.3",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.5",
    "numpy==1.23.5",
    "pandas>=2.1.0",
]

[dependency-groups]
dev = ["pre-commit>=4", "pre-commit-hooks>=5", "ruff>=0.12"]

[tool.ruff]
target-version = "py310"
force-exclude = true
extend-exclude = ["archive", "data", "docs", "scripts/legacy"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Configure a writable Matplotlib cache before importing plotting modules.
"magnet_site/build.py" = ["E402"]
"tests/test_static.py" = ["E402"]
# Set the repository import path for direct script execution.
"scripts/check_rebuild.py" = ["E402"]
