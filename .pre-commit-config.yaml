# Tools share the build's pinned uv environment.
exclude: ^(docs/|archive/|data/|scripts/legacy/)
repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: ruff-check
        name: Ruff lint (with fixes)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: unit-tests
        name: Fast unit tests
        entry: uv run --locked python -m unittest discover -s tests/unit -v
        language: system
        files: (^magnet_site/|^tests/unit/|^pyproject\.toml$|^uv\.lock$|^\.pre-commit-config\.yaml$)
        pass_filenames: false
        require_serial: true
